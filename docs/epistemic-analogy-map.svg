<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Epistemic analogy map — Fragility Persistence Matrix</title>
<desc>Five disciplinary lenses — Bloomberg, systems biology, meteorology, ethnography, topology — each mapping onto the Fragility Persistence Matrix as a core observational artifact, resolving to three market reads: regime shift, persistence, and exhaustion.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .label-primary { font-size: 14px; font-weight: 500; fill: #1a1a18; }
  .label-secondary { font-size: 12px; fill: #5f5e5a; }
  .label-center-primary { font-size: 14px; font-weight: 500; fill: #633806; }
  .label-center-secondary { font-size: 12px; fill: #854F0B; }
  .label-output { font-size: 12px; fill: #444441; }
  .label-meta { font-size: 10px; letter-spacing: 0.06em; fill: #888780; }

  @media (prefers-color-scheme: dark) {
    .label-primary { fill: #e8e6de; }
    .label-secondary { fill: #9c9a92; }
    .label-center-primary { fill: #FAC775; }
    .label-center-secondary { fill: #EF9F27; }
    .label-output { fill: #B4B2A9; }
    .label-meta { fill: #5f5e5a; }

    .box-gray { fill: #2C2C2A; stroke: #5F5E5A; }
    .box-teal  { fill: #04342C; stroke: #0F6E56; }
    .box-blue  { fill: #042C53; stroke: #185FA5; }
    .box-purple{ fill: #26215C; stroke: #534AB7; }
    .box-coral { fill: #4A1B0C; stroke: #993C1D; }
    .box-amber { fill: #412402; stroke: #854F0B; }
    .box-out   { fill: #2C2C2A; stroke: #5F5E5A; }
    .line-dash { stroke: #5F5E5A; }
  }

  .box-gray   { fill: #F1EFE8; stroke: #5F5E5A; }
  .box-teal   { fill: #E1F5EE; stroke: #0F6E56; }
  .box-blue   { fill: #E6F1FB; stroke: #185FA5; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; }
  .box-coral  { fill: #FAECE7; stroke: #993C1D; }
  .box-amber  { fill: #FAEEDA; stroke: #854F0B; }
  .box-out    { fill: #F1EFE8; stroke: #888780; }
  .line-dash  { stroke: #B4B2A9; fill: none; stroke-width: 0.5; stroke-dasharray: 4 3; }
</style>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Domain nodes (left column) -->
<rect x="40" y="40"  width="168" height="56" rx="8" stroke-width="0.5" class="box-gray"/>
<text x="124" y="64"  text-anchor="middle" dominant-baseline="central" class="label-primary">Bloomberg</text>
<text x="124" y="84"  text-anchor="middle" dominant-baseline="central" class="label-secondary">cross-asset dashboard</text>

<rect x="40" y="140" width="168" height="56" rx="8" stroke-width="0.5" class="box-teal"/>
<text x="124" y="164" text-anchor="middle" dominant-baseline="central" class="label-primary">Systems biology</text>
<text x="124" y="184" text-anchor="middle" dominant-baseline="central" class="label-secondary">state-space map</text>

<rect x="40" y="240" width="168" height="56" rx="8" stroke-width="0.5" class="box-blue"/>
<text x="124" y="264" text-anchor="middle" dominant-baseline="central" class="label-primary">Meteorology</text>
<text x="124" y="284" text-anchor="middle" dominant-baseline="central" class="label-secondary">propagation field</text>

<rect x="40" y="340" width="168" height="56" rx="8" stroke-width="0.5" class="box-purple"/>
<text x="124" y="364" text-anchor="middle" dominant-baseline="central" class="label-primary">Ethnography</text>
<text x="124" y="384" text-anchor="middle" dominant-baseline="central" class="label-secondary">participant-state obs.</text>

<rect x="40" y="400" width="168" height="56" rx="8" stroke-width="0.5" class="box-coral"/>
<text x="124" y="424" text-anchor="middle" dominant-baseline="central" class="label-primary">Topology</text>
<text x="124" y="444" text-anchor="middle" dominant-baseline="central" class="label-secondary">regime geometry</text>

<!-- Convergence lines → center -->
<line x1="208" y1="68"  x2="290" y2="160" class="line-dash" marker-end="url(#arr)"/>
<line x1="208" y1="168" x2="290" y2="200" class="line-dash" marker-end="url(#arr)"/>
<line x1="208" y1="268" x2="290" y2="220" class="line-dash" marker-end="url(#arr)"/>
<line x1="208" y1="368" x2="290" y2="248" class="line-dash" marker-end="url(#arr)"/>
<line x1="208" y1="428" x2="290" y2="268" class="line-dash" marker-end="url(#arr)"/>

<!-- Center node -->
<rect x="290" y="140" width="220" height="148" rx="12" stroke-width="0.8" class="box-amber"/>
<text x="400" y="172" text-anchor="middle" dominant-baseline="central" class="label-center-primary">Fragility Persistence</text>
<text x="400" y="192" text-anchor="middle" dominant-baseline="central" class="label-center-primary">Matrix</text>
<text x="400" y="218" text-anchor="middle" dominant-baseline="central" class="label-center-secondary">temporal fragility topology</text>
<text x="400" y="238" text-anchor="middle" dominant-baseline="central" class="label-center-secondary">propagation · absorption</text>
<text x="400" y="258" text-anchor="middle" dominant-baseline="central" class="label-center-secondary">continuation · exhaustion</text>

<!-- Divergence lines → outputs -->
<line x1="510" y1="200" x2="580" y2="100" class="line-dash" marker-end="url(#arr)"/>
<line x1="510" y1="214" x2="580" y2="214" class="line-dash" marker-end="url(#arr)"/>
<line x1="510" y1="228" x2="580" y2="328" class="line-dash" marker-end="url(#arr)"/>

<!-- Output nodes (right column) -->
<rect x="580" y="68"  width="80" height="44" rx="6" stroke-width="0.5" class="box-out"/>
<text x="620" y="90" text-anchor="middle" dominant-baseline="central" class="label-output">regime shift</text>

<rect x="580" y="192" width="80" height="44" rx="6" stroke-width="0.5" class="box-out"/>
<text x="620" y="214" text-anchor="middle" dominant-baseline="central" class="label-output">persistence</text>

<rect x="580" y="306" width="80" height="44" rx="6" stroke-width="0.5" class="box-out"/>
<text x="620" y="328" text-anchor="middle" dominant-baseline="central" class="label-output">exhaustion</text>

<!-- Section labels -->
<text x="124" y="22" text-anchor="middle" class="label-meta">five lenses</text>
<text x="400" y="118" text-anchor="middle" class="label-meta">core artifact</text>
<text x="620" y="50" text-anchor="middle" class="label-meta">three reads</text>

</svg>
